<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa Quente · Prévia do cenário</title><link rel="stylesheet" href="online.css"><body><main class="game" style="min-height:100dvh"><div id="stage" aria-label="Prévia interativa da mesa"></div><header class="game-header"><img src="logo-mesa-quente(1).png" alt="Mesa Quente"><div><span class="eyebrow">NOVO AMBIENTE</span><strong>Uma mesa. Muitas histórias.</strong></div><nav><a href="index.html">Voltar ao início</a></nav></header><footer class="game-footer"><div><span class="eyebrow">PRÉVIA VISUAL • SEM PARTIDA ONLINE</span><h1>Puxe uma boa conversa.</h1><p>Experimente a animação e as cores das cartas.</p></div><div class="round-actions"><button class="primary" id="draw">Puxar carta</button><button id="category">Trocar categoria</button></div></footer></main><script type="module">
import {Mesa3D,DECK_ART} from './mesa3d.js';
let phase='deck',deck=0;const scene=new Mesa3D(document.getElementById('stage'),{onDraw:draw,onError:()=>{}});const players=[{id:'a',nome:'Você',avatar:{emoji:'🦊',cor:'#bc643b'}},{id:'b',nome:'Luna',avatar:{emoji:'😼',cor:'#735299'}},{id:'c',nome:'Rafa',avatar:{emoji:'🐺',cor:'#507d9a'}},{id:'d',nome:'Bia',avatar:{emoji:'🐯',cor:'#af8544'}}];scene.setPlayers(players,'a','a');function update(){scene.setCard({id:'preview',phase,deckIndex:deck,showFront:true,text:'Qual história nossa você contaria de novo, só para rir mais uma vez?'});document.getElementById('draw').textContent=phase==='deck'?'Puxar carta':'Devolver à mesa';}function draw(){phase=phase==='deck'?'private':'deck';update();}document.getElementById('draw').onclick=draw;document.getElementById('category').onclick=()=>{deck=(deck+1)%DECK_ART.length;update();};update();
</script></body></html>
