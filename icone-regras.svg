<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="btn-regras-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="regras-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <linearGradient id="regras-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0a10"/>
      <stop offset="100%" stop-color="#120204"/>
    </linearGradient>
  </defs>
  <g filter="url(#btn-regras-shadow)">
    <!-- Fundo de botão circular cartoon -->
    <circle cx="50" cy="50" r="44" fill="#0b0b0b"/>
    <circle cx="50" cy="50" r="40" fill="url(#regras-card-bg)" stroke="url(#regras-gold)" stroke-width="4"/>
    
    <!-- Mini carta inclinada com '?' -->
    <rect x="33" y="22" width="34" height="48" rx="6" fill="#ff4d2e" stroke="#000000" stroke-width="3" transform="rotate(-6 50 46)"/>
    <rect x="36" y="25" width="28" height="42" rx="4" fill="#fff4cc" stroke="#000000" stroke-width="2" transform="rotate(-6 50 46)"/>
    
    <!-- Ponto de interrogação estilizado -->
    <text x="49" y="54" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#d90429" text-anchor="middle" transform="rotate(-6 50 46)">?</text>
  </g>
</svg>
