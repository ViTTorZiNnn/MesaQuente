<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background wall and ambient glow -->
    <radialGradient id="bg-wall-glow" cx="50%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#3d0b14"/>
      <stop offset="35%" stop-color="#24050a"/>
      <stop offset="70%" stop-color="#140205"/>
      <stop offset="100%" stop-color="#080102"/>
    </radialGradient>

    <!-- Halftone Pattern for comic vibe -->
    <pattern id="comic-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3" fill="#ff4d2e" opacity="0.06"/>
    </pattern>

    <!-- Spotlight Cone from Ceiling -->
    <linearGradient id="spotlight-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff7b39" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#ff4d2e" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#ff1a1a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Table Shadows & Felt Gradients -->
    <filter id="table-3d-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="36" stdDeviation="24" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <radialGradient id="table-felt-perspective" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#b81422"/>
      <stop offset="38%" stop-color="#800a14"/>
      <stop offset="75%" stop-color="#4e040a"/>
      <stop offset="100%" stop-color="#200104"/>
    </radialGradient>

    <linearGradient id="table-wood-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42140d"/>
      <stop offset="25%" stop-color="#280b06"/>
      <stop offset="70%" stop-color="#150402"/>
      <stop offset="100%" stop-color="#090101"/>
    </linearGradient>

    <linearGradient id="table-gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c68a14"/>
      <stop offset="25%" stop-color="#ffea79"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="75%" stop-color="#ffea79"/>
      <stop offset="100%" stop-color="#c68a14"/>
    </linearGradient>
  </defs>

  <!-- 1. PAREDE / AMBIENTE DE FUNDO -->
  <rect width="1920" height="1080" fill="url(#bg-wall-glow)"/>
  <rect width="1920" height="1080" fill="url(#comic-dots)"/>

  <!-- Cone de luz superior -->
  <polygon points="960,0 200,1080 1720,1080" fill="url(#spotlight-cone)"/>

  <!-- Brilho no chão sob a mesa -->
  <ellipse cx="960" cy="560" rx="900" ry="460" fill="#000000" opacity="0.6"/>

  <!-- 2. A MESA VERMELHA COM PERSPECTIVA 3D -->
  <g filter="url(#table-3d-shadow)">
    <!-- Borda externa preta ultra maciça -->
    <ellipse cx="960" cy="540" rx="860" ry="440" fill="#070707"/>

    <!-- Acabamento de couro / madeira nobre -->
    <ellipse cx="960" cy="530" rx="840" ry="420" fill="url(#table-wood-rim)" stroke="#000000" stroke-width="10"/>

    <!-- Filete de Ouro e Rebites -->
    <ellipse cx="960" cy="526" rx="766" ry="364" fill="none" stroke="url(#table-gold-rim)" stroke-width="6"/>
    <ellipse cx="960" cy="524" rx="754" ry="352" fill="#070707" stroke="#000000" stroke-width="6"/>

    <!-- Superfície do Feltro Vermelho (Arena de Jogo) -->
    <ellipse cx="960" cy="520" rx="742" ry="340" fill="url(#table-felt-perspective)"/>

    <!-- Anel com relevo e pontilhado no feltro -->
    <ellipse cx="960" cy="520" rx="550" ry="245" fill="none" stroke="#ff4d2e" stroke-width="3" stroke-dasharray="16 12" opacity="0.32"/>
    <ellipse cx="960" cy="520" rx="564" ry="254" fill="none" stroke="#ffda00" stroke-width="2" opacity="0.2"/>

    <!-- Rebites / Taxas Douradas ao redor da borda da mesa -->
    <g fill="#ffd166" stroke="#000000" stroke-width="3">
      <circle cx="960" cy="118" r="8"/>
      <circle cx="1270" cy="160" r="8"/>
      <circle cx="1550" cy="275" r="8"/>
      <circle cx="1720" cy="450" r="8"/>
      <circle cx="1720" cy="610" r="8"/>
      <circle cx="1550" cy="785" r="8"/>
      <circle cx="1270" cy="900" r="8"/>
      <circle cx="960" cy="942" r="8"/>
      <circle cx="650" cy="900" r="8"/>
      <circle cx="370" cy="785" r="8"/>
      <circle cx="200" cy="610" r="8"/>
      <circle cx="200" cy="450" r="8"/>
      <circle cx="370" cy="275" r="8"/>
      <circle cx="650" cy="160" r="8"/>
    </g>
  </g>
</svg>
